<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f1815">
<meta name="description" content="Deutsche Sprache-zu-Text-App mit Tonaufnahme.">
<title>Sprache zu Text</title>
<style>
:root{
  color-scheme:dark;
  --bg:#0b1411;
  --bg-soft:#101c18;
  --panel:#13231d;
  --panel-2:#172a23;
  --panel-3:#1b3028;
  --text:#eef6f2;
  --muted:#99aba4;
  --line:#294239;
  --line-2:#355248;
  --green:#62d39d;
  --green-2:#2f9e6f;
  --green-soft:rgba(98,211,157,.14);
  --red:#f38894;
  --red-soft:rgba(243,136,148,.12);
  --amber:#ddb169;
  --amber-soft:rgba(221,177,105,.14);
  --shadow:0 18px 42px rgba(0,0,0,.28);
  --radius:20px;
  --font-size:22px;
}
body.light{
  color-scheme:light;
  --bg:#f4f7f4;
  --bg-soft:#eef3ef;
  --panel:#ffffff;
  --panel-2:#f7faf8;
  --panel-3:#f0f5f2;
  --text:#172b24;
  --muted:#64746f;
  --line:#d9e4dd;
  --line-2:#c7d5cd;
  --green:#177b57;
  --green-2:#0f6a49;
  --green-soft:rgba(23,123,87,.08);
  --red:#c54c57;
  --red-soft:rgba(197,76,87,.08);
  --amber:#a77528;
  --amber-soft:rgba(167,117,40,.10);
  --shadow:0 16px 40px rgba(9,35,24,.08);
}
*{box-sizing:border-box}
html{height:100%;-webkit-text-size-adjust:100%}
body{
  margin:0;
  min-height:100dvh;
  background:
    radial-gradient(circle at top left, rgba(79,161,118,.12), transparent 34%),
    linear-gradient(180deg,var(--bg),var(--bg-soft));
  color:var(--text);
  font-family:Inter,system-ui,-apple-system,"Segoe UI",Arial,sans-serif;
  overflow:hidden;
}
button,textarea,input{font:inherit}
button{cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
button:disabled{opacity:.38;cursor:default}
button:focus-visible,textarea:focus-visible,input:focus-visible{outline:2px solid var(--green);outline-offset:2px}
[hidden]{display:none!important}
.shell{
  width:min(100%,1080px);
  height:100dvh;
  margin:0 auto;
  padding:clamp(10px,1.6vw,18px);
  padding-bottom:max(12px,env(safe-area-inset-bottom));
}
.app{
  height:100%;
  display:grid;
  grid-template-rows:auto auto minmax(0,1fr) auto auto;
  gap:12px;
  min-height:0;
}
.header{
  display:flex;align-items:center;justify-content:space-between;gap:14px;
}
.brand{display:flex;align-items:flex-start;gap:14px;min-width:0}
.brand-badge{
  width:46px;height:46px;border-radius:15px;display:grid;place-items:center;flex:none;
  background:linear-gradient(160deg,var(--green-2),var(--green));
  color:#fff;box-shadow:0 10px 24px rgba(31,119,83,.22);
}
.brand-badge .icon{width:22px;height:22px}
.brand-text{min-width:0}
.brand-text h1{margin:0;font-size:clamp(26px,3.2vw,38px);line-height:1.02;letter-spacing:-.04em}
.brand-text p{margin:5px 0 0;color:var(--muted);font-size:15px;line-height:1.3}
.header-right{display:flex;align-items:center;gap:10px;flex:none}
.status-pill{
  display:flex;align-items:center;gap:10px;min-width:160px;max-width:260px;
  padding:10px 14px;border-radius:16px;border:1px solid var(--line);
  background:linear-gradient(180deg,var(--panel),var(--panel-2));
  box-shadow:var(--shadow);
}
.status-pill .dot{width:10px;height:10px;border-radius:50%;background:#889a94;flex:none}
.status-pill.recording .dot{background:var(--green);animation:pulse 1.7s ease-in-out infinite}
.status-pill.paused .dot{background:var(--amber)}
.status-pill.done .dot{background:var(--green);animation:pulse 2.7s ease-in-out 3}
.status-pill.error .dot{background:var(--red)}
.status-copy{min-width:0}
.status-copy strong{display:block;font-size:13px;font-weight:780;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.status-copy span{display:block;margin-top:2px;font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top-actions{display:flex;align-items:center;gap:8px}
.icon-btn{
  width:46px;height:46px;border-radius:16px;border:1px solid var(--line);
  background:linear-gradient(180deg,var(--panel),var(--panel-2));color:var(--text);
  display:grid;place-items:center;box-shadow:var(--shadow)
}
.icon-btn:hover:not(:disabled),.chip:hover:not(:disabled),.tool-btn:hover:not(:disabled),.action-btn:hover:not(:disabled){transform:translateY(-1px);border-color:var(--line-2)}
.main-card{
  min-height:0;display:flex;flex-direction:column;overflow:hidden;
  border:1px solid var(--line);border-radius:var(--radius);
  background:linear-gradient(180deg,var(--panel),var(--panel-2));box-shadow:var(--shadow)
}
.main-card.recording{border-color:rgba(98,211,157,.4);box-shadow:0 0 0 1px rgba(98,211,157,.12),var(--shadow)}
.editor-top{
  display:flex;align-items:center;justify-content:space-between;gap:10px;
  padding:14px 16px 10px 16px;border-bottom:1px solid rgba(255,255,255,.03)
}
.editor-title{font-size:14px;font-weight:760;color:var(--muted);letter-spacing:.01em}
.editor-actions{display:flex;align-items:center;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.chip{
  height:40px;padding:0 14px;border-radius:14px;border:1px solid var(--line);
  background:var(--panel-3);color:var(--text);display:flex;align-items:center;gap:8px;
  font-size:13px;font-weight:700;white-space:nowrap
}
.chip .icon{width:17px;height:17px}
.chip.small{min-width:40px;justify-content:center;padding:0 12px}
.chip.active{background:var(--green-soft);color:var(--green);border-color:rgba(98,211,157,.28)}
.editor-area{min-height:0;display:flex;flex-direction:column;flex:1}
#result{
  flex:1;min-height:0;width:100%;resize:none;border:0;outline:0!important;
  background:transparent;color:var(--text);padding:14px 18px 18px;
  font-size:var(--font-size);line-height:1.58;letter-spacing:-.015em;caret-color:var(--green)
}
#result::placeholder{color:var(--muted);opacity:.75}
.editor-bottom{
  display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;
  padding:10px 16px;border-top:1px solid var(--line);background:rgba(255,255,255,.02)
}
.stats{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.quick-tools{display:grid;grid-template-columns:1.25fr 1fr 1fr 1fr;gap:10px}
.tool-btn{
  min-width:0;height:48px;border-radius:16px;border:1px solid var(--line);
  background:linear-gradient(180deg,var(--panel),var(--panel-3));color:var(--text);
  display:flex;align-items:center;justify-content:center;gap:8px;
  font-size:15px;font-weight:760;padding:0 14px;box-shadow:var(--shadow)
}
.tool-btn.delete{color:var(--red)}
.record-tools{display:grid;grid-template-columns:1.2fr 1fr 1fr;gap:10px}
.action-btn{
  min-width:0;height:56px;border-radius:18px;border:1px solid var(--line);
  display:flex;align-items:center;justify-content:center;gap:10px;
  font-size:16px;font-weight:800;padding:0 18px;box-shadow:var(--shadow);
  background:linear-gradient(180deg,var(--panel),var(--panel-3));color:var(--text)
}
.action-btn .icon{width:18px;height:18px}
.action-btn.start{background:linear-gradient(180deg,var(--green),var(--green-2));border-color:transparent;color:#fff}
.action-btn.pause{color:var(--amber);background:linear-gradient(180deg,var(--panel),var(--panel-3))}
.action-btn.stop{color:var(--red)}
.audio-card{
  border:1px solid var(--line);border-radius:var(--radius);
  background:linear-gradient(180deg,var(--panel),var(--panel-2));box-shadow:var(--shadow);
  padding:12px 14px 10px;display:flex;flex-direction:column;gap:10px
}
.audio-head{display:flex;align-items:center;gap:10px;min-width:0}
.audio-title{font-size:16px;font-weight:820;white-space:nowrap;margin-right:2px}
.audio-main-controls{display:flex;align-items:center;gap:8px;min-width:0}
.mini-btn{
  height:36px;min-width:36px;padding:0 10px;border-radius:12px;border:1px solid var(--line);
  background:var(--panel-3);color:var(--text);display:flex;align-items:center;justify-content:center;gap:6px;
  font-size:13px;font-weight:780;white-space:nowrap
}
.mini-btn.play{width:42px;height:42px;border-radius:50%;border-color:rgba(98,211,157,.3);color:var(--green);background:var(--green-soft);font-size:17px}
.time{margin-left:auto;font-size:14px;font-weight:760;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.audio-side{display:flex;align-items:center;gap:6px;margin-left:2px;flex:none}
.plain-btn{width:38px;height:38px;border:0;background:transparent;color:var(--text);display:grid;place-items:center;border-radius:12px}
.plain-btn.delete{color:var(--red)}
.plain-btn .icon{width:18px;height:18px}
.seek{width:100%;margin:0;appearance:none;height:8px;border-radius:999px;background:linear-gradient(90deg,rgba(98,211,157,.24),rgba(255,255,255,.06));outline:0;cursor:pointer}
.seek::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;width:18px;height:18px;border-radius:50%;background:var(--green);border:3px solid var(--panel)}
.seek::-moz-range-thumb{width:18px;height:18px;border-radius:50%;background:var(--green);border:3px solid var(--panel)}
.audio-note{font-size:12px;color:var(--muted);min-height:16px}
.toast{
  position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom));transform:translate(-50%,10px);
  max-width:min(90vw,520px);padding:11px 16px;border-radius:14px;background:#183127;color:#fff;
  box-shadow:0 18px 38px rgba(0,0,0,.28);font-size:13px;font-weight:700;opacity:0;pointer-events:none;transition:opacity .22s,transform .22s;z-index:20;text-align:center
}
.toast.show{opacity:1;transform:translate(-50%,0)}
.icon{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.fill{fill:currentColor;stroke:none}
@keyframes pulse{50%{opacity:.28;transform:scale(.88)}}
@media (max-width:980px){
  .header{align-items:flex-start;flex-direction:column}
  .header-right{width:100%;justify-content:space-between}
}
@media (max-width:720px){
  .shell{padding:10px 10px max(10px,env(safe-area-inset-bottom))}
  .app{gap:10px}
  .brand-badge{width:40px;height:40px;border-radius:14px}
  .brand-text h1{font-size:22px}
  .brand-text p{font-size:13px}
  .status-pill{min-width:0;flex:1}
  .editor-top{padding:12px 12px 8px}
  #result{padding:12px 14px 15px;font-size:calc(var(--font-size) - 1px)}
  .editor-bottom{padding:8px 12px}
  .chip{height:36px;font-size:12px;padding:0 12px}
  .quick-tools{grid-template-columns:1fr 1fr}
  .record-tools{grid-template-columns:1fr 1fr 1fr}
  .tool-btn,.action-btn{height:46px;font-size:14px;border-radius:15px}
  .audio-card{padding:10px 10px 9px}
  .audio-head{flex-wrap:wrap}
  .audio-main-controls{order:2;flex:1 1 auto}
  .audio-title{order:1;font-size:15px}
  .time{order:3;margin-left:0}
  .audio-side{order:4;margin-left:auto}
}
@media (max-width:520px){
  .app{grid-template-rows:auto auto minmax(0,1fr) auto auto}
  .header-right{gap:8px}
  .top-actions .icon-btn{width:42px;height:42px;border-radius:14px}
  .quick-tools{gap:8px}
  .tool-btn{font-size:13px;padding:0 10px}
  .record-tools{gap:8px}
  .action-btn{font-size:14px;padding:0 10px}
  .audio-main-controls{gap:6px}
  .mini-btn{height:34px;min-width:34px;padding:0 8px;border-radius:11px;font-size:12px}
  .mini-btn.play{width:38px;height:38px}
  .time{font-size:13px}
}
@media (max-width:390px){
  .brand{gap:10px}
  .brand-badge{display:none}
  .brand-text h1{font-size:20px}
  .brand-text p{font-size:12px}
  .status-pill{padding:8px 10px;border-radius:14px}
  .status-copy strong{font-size:12px}
  .status-copy span{font-size:10px}
  .editor-actions{gap:6px}
  .chip.small{width:36px;min-width:36px;padding:0}
  .quick-tools{grid-template-columns:1fr 1fr}
  .tool-btn .label-sm-hide{display:none}
  .audio-title{font-size:14px}
}
@media (max-height:720px){
  .app{gap:9px}
  .editor-top{padding:10px 12px 7px}
  .editor-bottom{padding:8px 12px}
  .audio-card{padding:10px}
  .tool-btn{height:44px}
  .action-btn{height:50px}
}
body.keyboard-open{overflow:auto;height:auto;min-height:100dvh}
body.keyboard-open .shell{height:auto;min-height:100dvh}
body.keyboard-open .app{height:auto;min-height:100dvh}
body.keyboard-open #result{min-height:34vh}

/* Gemeinsame, einzeilige Bedienleiste: niemals umbrechen oder horizontal hinausragen. */
.app{grid-template-rows:auto minmax(0,1fr) auto auto}
.command-row{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:7px;min-width:0}
.command-btn{
  min-width:0;width:100%;height:52px;border:1px solid var(--line);border-radius:13px;
  padding:4px 5px;display:flex;align-items:center;justify-content:center;gap:7px;
  background:linear-gradient(180deg,var(--panel),var(--panel-3));color:var(--text);
  font-size:clamp(10px,1.13vw,13px);font-weight:740;white-space:nowrap;
  letter-spacing:-.02em;box-shadow:0 5px 14px rgba(0,0,0,.09);
  transition:background-color .18s,border-color .18s,transform .16s,opacity .18s;
}
.command-btn .icon{width:16px;height:16px;flex:none}
.command-btn.command-start{background:linear-gradient(140deg,var(--green),var(--green-2));color:#fff;border-color:transparent}
.command-btn.command-pause{color:var(--amber)}
.command-btn.command-stop,.command-btn.command-delete{color:var(--red)}
.command-btn:hover:not(:disabled){transform:translateY(-1px);border-color:var(--line-2)}
.command-btn:active:not(:disabled){transform:translateY(0)}
.label-short{display:none}
@media(max-width:920px){
  .command-row{gap:5px}
  .command-btn{flex-direction:column;height:56px;gap:3px;font-size:10px;letter-spacing:-.035em;padding:4px 1px}
  .command-btn .icon{width:18px;height:18px}
  .label-long{display:none}
  .label-short{display:inline}
}
@media(max-width:520px){
  .app{grid-template-rows:auto minmax(0,1fr) auto auto}
  .command-row{gap:4px}
  .command-btn{height:53px;border-radius:10px;font-size:9px}
  .command-btn .icon{width:17px;height:17px}
}
@media(max-width:345px){
  .shell{padding-left:7px;padding-right:7px}
  .command-row{gap:3px}
  .command-btn{font-size:8.5px;height:50px;border-radius:9px}
  .command-btn .icon{height:16px;width:16px}
}
@media(max-height:640px){.command-btn{height:44px}.command-row{gap:4px}}
@media(prefers-reduced-motion:reduce){.command-btn{transition:none}}
</style>
</head>
<body>
<svg width="0" height="0" aria-hidden="true" style="position:absolute;overflow:hidden"><defs>
  <symbol id="i-mic" viewBox="0 0 24 24"><rect x="9" y="2" width="6" height="12" rx="3"/><path d="M5 10a7 7 0 0 0 14 0M12 17v5M8 22h8"/></symbol>
  <symbol id="i-pause" viewBox="0 0 24 24"><rect class="fill" x="5" y="4" width="5" height="16" rx="1"/><rect class="fill" x="14" y="4" width="5" height="16" rx="1"/></symbol>
  <symbol id="i-stop" viewBox="0 0 24 24"><rect class="fill" x="4" y="4" width="16" height="16" rx="2"/></symbol>
  <symbol id="i-play" viewBox="0 0 24 24"><path class="fill" d="M8 5v14l11-7z"/></symbol>
  <symbol id="i-copy" viewBox="0 0 24 24"><rect x="8" y="8" width="12" height="12" rx="2"/><path d="M16 8V6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h2"/></symbol>
  <symbol id="i-trash" viewBox="0 0 24 24"><path d="M3 6h18M8 6V4h8v2m3 0-1 15H6L5 6m5 4v7m4-7v7"/></symbol>
  <symbol id="i-backspace" viewBox="0 0 24 24"><path d="m9 4-7 8 7 8h11a2 2 0 0 0 2-2V6a2 2 0 0 0-2-2H9Zm3 5 6 6m0-6-6 6"/></symbol>
  <symbol id="i-undo" viewBox="0 0 24 24"><path d="m9 14-5-5 5-5M4 9h10a6 6 0 1 1 0 12h-3"/></symbol>
  <symbol id="i-volume" viewBox="0 0 24 24"><path d="M11 5 6 9H3v6h3l5 4V5ZM15 9a5 5 0 0 1 0 6m3-9a9 9 0 0 1 0 12"/></symbol>
  <symbol id="i-minus10" viewBox="0 0 24 24"><path d="M11 17H3m0 0 3-3m-3 3 3 3"/><path d="M21 7a8 8 0 1 0 0 10"/></symbol>
  <symbol id="i-plus10" viewBox="0 0 24 24"><path d="M13 17h8m0 0-3-3m3 3-3 3"/><path d="M3 7a8 8 0 1 1 0 10"/></symbol>
  <symbol id="i-download" viewBox="0 0 24 24"><path d="M12 3v11m0 0 4-4m-4 4-4-4M4 20h16"/></symbol>
  <symbol id="i-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M4.93 4.93l1.42 1.42m11.3 11.3 1.42 1.42M2 12h2m16 0h2M4.93 19.07l1.42-1.42m11.3-11.3 1.42-1.42"/></symbol>
  <symbol id="i-moon" viewBox="0 0 24 24"><path d="M20.5 14.1A9 9 0 0 1 9.9 3.5 9 9 0 1 0 20.5 14.1Z"/></symbol>
</defs></svg>

<div class="shell">
  <main class="app">
    <header class="header">
      <div class="brand">
        <div class="brand-badge"><svg class="icon"><use href="#i-mic"></use></svg></div>
        <div class="brand-text">
          <h1>Sprache zu Text</h1>
          <p>Deutsch sprechen. Text und Tonaufnahme bleiben sauber und übersichtlich.</p>
        </div>
      </div>
      <div class="header-right">
        <div class="status-pill" id="status">
          <div class="dot"></div>
          <div class="status-copy">
            <strong id="statusText">Bereit</strong>
            <span id="statusSub">Mikrofon starten, wenn Sie diktieren möchten.</span>
          </div>
        </div>
        <div class="top-actions">
          <button class="icon-btn" id="theme" aria-label="Design wechseln" title="Design wechseln">
            <svg class="icon"><use id="themeUse" href="#i-sun"></use></svg>
          </button>
        </div>
      </div>
    </header>

    <section class="main-card" id="editor">
      <div class="editor-top">
        <div class="editor-title">Ihr Text</div>
        <div class="editor-actions">
          <button class="chip" id="read"><svg class="icon"><use href="#i-volume"></use></svg><span id="readLabel">Text vorlesen</span></button>
          <button class="chip small" id="smaller" title="Schrift verkleinern">A−</button>
          <button class="chip small" id="bigger" title="Schrift vergrößern">A+</button>
        </div>
      </div>
      <div class="editor-area">
        <textarea id="result" placeholder="Sprechen Sie auf Deutsch. Der Text erscheint hier …" spellcheck="true" autocapitalize="sentences" lang="de"></textarea>
      </div>
      <div class="editor-bottom">
        <div class="stats" id="stats">0 Wörter · 0 Zeichen</div>
      </div>
    </section>

    <!-- Eine einzige Bedienleiste auf allen Geräten; klare vollständige Beschriftungen bleiben für Screenreader erhalten. -->
    <nav class="command-row" aria-label="Diktat und Textbearbeitung">
      <button class="command-btn command-start" id="start" aria-label="Starten" title="Aufnahme starten oder fortsetzen">
        <svg class="icon"><use href="#i-mic"></use></svg><span class="label-long" id="startLabel">Starten</span><span class="label-short" id="startShort">Start</span>
      </button>
      <button class="command-btn command-pause" id="pauseBtn" aria-label="Pause" title="Aufnahme pausieren">
        <svg class="icon fill"><use href="#i-pause"></use></svg><span>Pause</span>
      </button>
      <button class="command-btn command-stop" id="stopBtn" aria-label="Stoppen" title="Aufnahme beenden und Tondatei erstellen">
        <svg class="icon fill"><use href="#i-stop"></use></svg><span class="label-long">Stoppen</span><span class="label-short">Stopp</span>
      </button>
      <button class="command-btn" id="copyBtn" aria-label="Kopieren" title="Gesamten Text kopieren">
        <svg class="icon"><use href="#i-copy"></use></svg><span class="label-long">Kopieren</span><span class="label-short">Kopie</span>
      </button>
      <button class="command-btn" id="deleteWord" aria-label="1 Wort löschen" title="Letztes Wort löschen">
        <svg class="icon"><use href="#i-backspace"></use></svg><span class="label-long">1 Wort löschen</span><span class="label-short">1 Wort</span>
      </button>
      <button class="command-btn" id="undo" aria-label="Wiederherstellen" title="Letzte Änderung wiederherstellen">
        <svg class="icon"><use href="#i-undo"></use></svg><span class="label-long">Wiederherstellen</span><span class="label-short">Zurück</span>
      </button>
      <button class="command-btn command-delete" id="clear" aria-label="Alles löschen" title="Gesamten Text löschen">
        <svg class="icon"><use href="#i-trash"></use></svg><span class="label-long">Alles löschen</span><span class="label-short">Löschen</span>
      </button>
    </nav>

    <section class="audio-card">
      <div class="audio-head">
        <div class="audio-title">Tonaufnahme</div>
        <div class="audio-main-controls">
          <button class="mini-btn" id="back" title="10 Sekunden zurück">−10s</button>
          <button class="mini-btn play" id="play" title="Wiedergabe"><svg class="icon fill"><use id="playIconUse" href="#i-play"></use></svg></button>
          <button class="mini-btn" id="forward" title="10 Sekunden vor">+10s</button>
        </div>
        <div class="time" id="time">00:00 / 00:00</div>
        <div class="audio-side">
          <button class="plain-btn" id="download" title="Speichern"><svg class="icon"><use href="#i-download"></use></svg></button>
          <button class="plain-btn delete" id="remove" title="Löschen"><svg class="icon"><use href="#i-trash"></use></svg></button>
        </div>
      </div>
      <input id="seek" class="seek" type="range" min="0" max="1000" value="0">
      <div class="audio-note" id="audioNote">Noch keine Tonaufnahme</div>
      <audio id="audio" preload="metadata"></audio>
    </section>
  </main>
</div>

<div class="toast" id="toast"></div>

<script>
'use strict';
const $ = id => document.getElementById(id);
const dom = {
  result:$('result'), editor:$('editor'), status:$('status'), statusText:$('statusText'), statusSub:$('statusSub'),
  start:$('start'), startLabel:$('startLabel'), pause:$('pauseBtn'), stop:$('stopBtn'),
  copy:$('copyBtn'), read:$('read'), readLabel:$('readLabel'), clear:$('clear'), del:$('deleteWord'), undo:$('undo'),
  stats:$('stats'), theme:$('theme'), themeUse:$('themeUse'), small:$('smaller'), big:$('bigger'),
  audio:$('audio'), seek:$('seek'), play:$('play'), playIconUse:$('playIconUse'), back:$('back'), forward:$('forward'), time:$('time'),
  download:$('download'), remove:$('remove'), audioNote:$('audioNote'), toast:$('toast')
};
const SpeechEngine = window.SpeechRecognition || window.webkitSpeechRecognition;
const KEY_TEXT = 'speech2text_de_text';
const KEY_THEME = 'speech2text_de_theme';
const KEY_SIZE = 'speech2text_de_size';
const state = {
  committed:'', phase:'idle', session:null, restart:null, undo:[], run:0,
  media:null, stream:null, chunks:[], audioBlob:null, audioURL:'', audioSeconds:0, recordedMs:0, resumedAt:0,
  fontSize:22, speaking:false, utterance:null, toastTimer:0
};
function saved(key){try{return localStorage.getItem(key)}catch(_){return null}}
function save(key,val){try{localStorage.setItem(key,val)}catch(_){}}
function notice(msg){dom.toast.textContent=msg;dom.toast.classList.add('show');clearTimeout(state.toastTimer);state.toastTimer=setTimeout(()=>dom.toast.classList.remove('show'),2300)}
function setTheme(light){document.body.classList.toggle('light', light);dom.themeUse.setAttribute('href', light ? '#i-moon' : '#i-sun');save(KEY_THEME, light ? '1' : '0')}
function status(text, mode='idle', sub=''){
  dom.statusText.textContent = text;
  dom.statusSub.textContent = sub || (mode==='recording' ? 'Sprache wird laufend erkannt.' : mode==='paused' ? 'Aufnahme ist pausiert.' : mode==='done' ? 'Text bleibt gespeichert.' : mode==='error' ? 'Bitte Mikrofon und Verbindung prüfen.' : 'Mikrofon starten, wenn Sie diktieren möchten.');
  dom.status.className = 'status-pill' + (mode && mode!=='idle' ? ' ' + mode : '');
}
function count(){const t=dom.result.value;const words=t.trim()?t.trim().split(/\s+/u).length:0;dom.stats.textContent=`${words} ${words===1?'Wort':'Wörter'} · ${t.length} Zeichen`}
// Wortzusammenführung und Satzanfänge entsprechen der getesteten Diktat-Vorlage index(5).html.
function capitalizeSentences(text){
  return text.replace(/(^|[.!?]\s*|\n\s*)([a-zäöüß])/gmu,(all,prefix,letter)=>prefix+letter.toUpperCase());
}
function appendSpeech(original,addition){
  const more=(addition||'').trim(); if(!more)return original;
  if(!original)return more;
  return original + (/\s$/u.test(original)?'':' ') + more;
}
function setText(text){state.committed=capitalizeSentences(text);dom.result.value=state.committed;save(KEY_TEXT,state.committed);count()}
function snapshot(){state.undo.push(dom.result.value);if(state.undo.length>40)state.undo.shift();dom.undo.disabled = !state.undo.length}
function assemble(base,pieces){let text=base;for(const piece of pieces)text=appendSpeech(text,piece);return capitalizeSentences(text)}
function snapshotResult(session,withInterim=false){const pieces=[...session.final];if(withInterim&&session.interim)pieces.push(session.interim);return assemble(session.base,pieces)}
function drawButtons(){
  const recording = state.phase==='recording';
  const paused = state.phase==='paused';
  dom.start.disabled = recording;
  dom.pause.disabled = !recording;
  dom.stop.disabled = !recording && !paused;
  dom.startLabel.textContent = paused ? 'Fortsetzen' : 'Starten';
  $('startShort').textContent = paused ? 'Weiter' : 'Start';
  dom.start.setAttribute('aria-label', paused ? 'Fortsetzen' : 'Starten');
}
function stopTracks(stream){if(stream) for(const tr of stream.getTracks()) tr.stop()}
function clearRecorder(){if(state.media && state.media.state!=='inactive'){try{state.media.stop()}catch(_){}} stopTracks(state.stream); state.media=null; state.stream=null; state.resumedAt=0;}
function clearAudio(){
  if(state.audioURL) URL.revokeObjectURL(state.audioURL);
  state.audioBlob=null; state.audioURL=''; state.audioSeconds=0; state.recordedMs=0; state.resumedAt=0;
  dom.audio.removeAttribute('src'); dom.audio.load(); dom.audioNote.textContent='Noch keine Tonaufnahme';
  refreshAudioButtons(); updatePlayPosition();
}
function refreshAudioButtons(){const ready=!!state.audioURL;[dom.seek,dom.play,dom.back,dom.forward,dom.download,dom.remove].forEach(el=>el.disabled=!ready);if(!ready){dom.playIconUse.setAttribute('href','#i-play')}}
function formatTime(s){s=Number.isFinite(s)?Math.max(0,Math.floor(s)):0;return `${String(Math.floor(s/60)).padStart(2,'0')}:${String(s%60).padStart(2,'0')}`}
function duration(){const d=dom.audio.duration;return Number.isFinite(d)&&d>0?d:state.audioSeconds}
function updatePlayPosition(){const current=Number.isFinite(dom.audio.currentTime)?dom.audio.currentTime:0;const total=duration();dom.time.textContent=`${formatTime(current)} / ${formatTime(total)}`;dom.seek.value=total>0?String(Math.round(Math.max(0,Math.min(1,current/total))*1000)):'0'}
function finalizeBlob(media,parts,ms){
  if(!parts.length) return;
  const blob = new Blob(parts,{type:media.mimeType||parts[0].type||'audio/webm'});
  if(!blob.size) return;
  if(state.audioURL) URL.revokeObjectURL(state.audioURL);
  state.audioBlob=blob; state.audioSeconds=ms/1000; state.audioURL=URL.createObjectURL(blob);
  dom.audio.src=state.audioURL; dom.audio.load(); dom.audioNote.textContent='Aufnahme bereit';
  refreshAudioButtons(); updatePlayPosition();
}
async function openMicAndStart(run){
  let stream=null;
  try{
    if(!navigator.mediaDevices?.getUserMedia || typeof MediaRecorder==='undefined') throw new Error('MediaRecorder unavailable');
    stream = await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true,autoGainControl:true},video:false});
    if(run!==state.run || !['recording','paused'].includes(state.phase)){stopTracks(stream);return}
    const types=['audio/webm;codecs=opus','audio/mp4','audio/webm','audio/ogg;codecs=opus'];
    const type=types.find(x=>MediaRecorder.isTypeSupported?.(x));
    const media = new MediaRecorder(stream, type ? {mimeType:type} : undefined);
    state.media=media; state.stream=stream;
    const parts=[]; state.chunks=parts;
    media.ondataavailable=e=>{if(e.data?.size) parts.push(e.data)};
    media.onerror=()=>{dom.audioNote.textContent='Audioaufnahme fehlgeschlagen'};
    media.onstop=()=>{
      stopTracks(stream);
      if(state.stream===stream) state.stream=null;
      if(state.media===media) state.media=null;
      if(run!==state.run) return;
      const total=state.recordedMs + (state.resumedAt ? performance.now()-state.resumedAt : 0);
      state.recordedMs=total; state.resumedAt=0;
      finalizeBlob(media,parts,total);
    };
    media.start(1000);
    state.resumedAt=performance.now();
    dom.audioNote.textContent='Aufnahme läuft …';
    if(state.phase==='paused'){
      media.pause();
      state.resumedAt=0;
      dom.audioNote.textContent='Aufnahme pausiert';
    }
  }catch(error){
    stopTracks(stream);
    if(run!==state.run) return;
    dom.audioNote.textContent='Nur Texterkennung verfügbar';
    console.info('Tonaufnahme nicht verfügbar:',error);
  }finally{
    if(run===state.run && state.phase==='recording' && !state.session) launchRecognition();
  }
}
function scheduleNext(delay=320){clearTimeout(state.restart); if(state.phase!=='recording') return; state.restart=setTimeout(()=>{state.restart=null; if(state.phase==='recording' && !state.session) launchRecognition()}, delay)}
function launchRecognition(){
  if(state.phase!=='recording' || state.session || !SpeechEngine) return;
  const engine = new SpeechEngine();
  engine.lang='de-DE'; engine.continuous=false; engine.interimResults=true; engine.maxAlternatives=1;
  const session={engine,base:state.committed,final:[],interim:'',invalid:false,error:''};
  state.session=session;
  engine.onstart=()=>{ if(state.session!==session) return; if(state.phase!=='recording'){try{engine.stop()}catch(_){}} else {status('Hört zu …','recording'); dom.editor.classList.add('recording');} };
  engine.onresult=e=>{
    if(state.session!==session || session.invalid) return;
    let final='', interim='';
    // Wie in der bewährten deutschen Version werden alle Ergebnisse erneut aufgebaut.
    for(let i=0;i<e.results.length;i++){
      const text=e.results[i]?.[0]?.transcript||'';
      if(e.results[i].isFinal) final=appendSpeech(final,text);
      else interim=appendSpeech(interim,text);
    }
    session.final=final ? [final] : []; session.interim=interim;
    dom.result.value=snapshotResult(session,true); count(); dom.result.scrollTop=dom.result.scrollHeight;
  };
  engine.onerror=e=>{
    if(state.session!==session) return;
    session.error=e.error||'unknown';
    if(['not-allowed','service-not-allowed','audio-capture','network','language-not-supported'].includes(session.error)){
      if(state.phase==='recording') pauseRecord();
      status(session.error==='network'?'Netzwerkfehler':'Mikrofon prüfen','error');
    }
  };
  engine.onend=()=>{
    if(state.session!==session) return;
    state.session=null;
    if(!session.invalid){
      const pieces=[...session.final];
      if(state.phase!=='recording' && session.interim) pieces.push(session.interim);
      setText(assemble(session.base,pieces));
    }
    dom.editor.classList.remove('recording');
    if(state.phase==='recording'){status('Hört zu …','recording'); scheduleNext(session.error==='no-speech'?560:280)}
    else if(state.phase==='paused'){status('Pausiert','paused')}
  };
  try{engine.start()}catch(error){state.session=null; dom.editor.classList.remove('recording'); status('Mikrofon prüfen','error'); notice('Spracherkennung konnte nicht starten.'); console.info(error)}
}
async function startRecord(){
  if(!SpeechEngine){notice('Deutsche Spracherkennung nicht unterstützt.'); return}
  if(state.phase==='recording' || state.phase==='finishing') return;
  stopRead();
  if(state.phase==='paused'){
    state.phase='recording';
    if(state.media?.state==='paused'){
      try{ state.media.resume(); state.resumedAt=performance.now(); dom.audioNote.textContent='Aufnahme läuft …'; }
      catch(_){ dom.audioNote.textContent='Audio kann nicht fortgesetzt werden'; }
    }
    drawButtons(); status('Hört zu …','recording'); if(!state.session) launchRecognition(); return;
  }
  if(state.audioURL && !confirm('Neue Aufnahme beginnen? Die bisherige Tonaufnahme wird ersetzt. Bitte vorher speichern.')) return;
  clearAudio(); state.run++; const run=state.run; state.phase='recording'; state.recordedMs=0; state.resumedAt=0;
  drawButtons(); status('Mikrofon startet …','recording');
  await openMicAndStart(run);
}
function pauseRecord(){
  if(state.phase!=='recording') return;
  state.phase='paused'; clearTimeout(state.restart);
  if(state.media?.state==='recording'){
    if(state.resumedAt){ state.recordedMs += performance.now()-state.resumedAt; state.resumedAt=0; }
    try{ state.media.pause(); }catch(_){ }
  }
  if(state.session){ try{ state.session.engine.stop(); }catch(_){ } }
  drawButtons(); status('Pausiert','paused');
  if(state.media) dom.audioNote.textContent='Aufnahme pausiert';
  dom.editor.classList.remove('recording');
}
function stopRecord(){
  if(!['recording','paused'].includes(state.phase)) return;
  state.phase='finishing'; clearTimeout(state.restart);
  if(state.session){ try{ state.session.engine.stop(); }catch(_){ } }
  if(state.media && state.media.state!=='inactive'){ try{ state.media.stop(); }catch(_){ } }
  else { stopTracks(state.stream); state.stream=null; state.media=null; }
  state.phase='idle'; drawButtons(); status('Bereit','done'); dom.editor.classList.remove('recording');
  if(!state.media && !state.audioURL) dom.audioNote.textContent='Kein Ton verfügbar';
}
function stopRead(){
  if('speechSynthesis' in window) window.speechSynthesis.cancel();
  state.speaking=false; state.utterance=null; dom.read.classList.remove('active'); dom.readLabel.textContent='Text vorlesen';
}
function clearSessionForEdit(){ if(state.session){ state.session.invalid=true; try{state.session.engine.abort()}catch(_){}} }

dom.theme.onclick=()=>setTheme(!document.body.classList.contains('light'));
dom.small.onclick=()=>{state.fontSize=Math.max(16,state.fontSize-2); document.documentElement.style.setProperty('--font-size',state.fontSize+'px'); save(KEY_SIZE,String(state.fontSize))};
dom.big.onclick=()=>{state.fontSize=Math.min(36,state.fontSize+2); document.documentElement.style.setProperty('--font-size',state.fontSize+'px'); save(KEY_SIZE,String(state.fontSize))};

dom.result.addEventListener('beforeinput',()=>{ if(!dom._typingTimer){ snapshot(); dom._typingTimer=setTimeout(()=>dom._typingTimer=null,900);} });
dom.result.addEventListener('input',()=>{ setText(dom.result.value); clearSessionForEdit(); });

dom.copy.onclick=async()=>{
  const text=dom.result.value.trim(); if(!text){notice('Kein Text zum Kopieren.'); return}
  try{ await navigator.clipboard.writeText(dom.result.value); notice('Text kopiert.'); }
  catch(_){ dom.result.focus(); dom.result.select(); try{ document.execCommand('copy'); notice('Text kopiert.'); }catch(__){ notice('Bitte Text manuell kopieren.'); } }
};
dom.del.onclick=()=>{ const t=dom.result.value.replace(/\s+$/u,''); if(!t) return; snapshot(); setText(t.replace(/\S+$/u,'').replace(/\s+$/u,'')); clearSessionForEdit(); notice('Letztes Wort gelöscht.'); };
dom.clear.onclick=()=>{ if(!dom.result.value) return; snapshot(); setText(''); clearSessionForEdit(); notice('Text gelöscht.'); };
dom.undo.onclick=()=>{ if(!state.undo.length) return; const prev=state.undo.pop(); setText(prev); dom.undo.disabled=!state.undo.length; clearSessionForEdit(); notice('Wiederhergestellt.'); };

dom.read.onclick=()=>{
  if(!('speechSynthesis' in window)){ notice('Vorlesen wird hier nicht unterstützt.'); return; }
  if(state.speaking){ stopRead(); return; }
  const text=dom.result.value.trim(); if(!text){ notice('Kein Text zum Vorlesen.'); return; }
  if(state.phase==='recording') pauseRecord();
  const u = new SpeechSynthesisUtterance(dom.result.value);
  u.lang='de-DE'; u.rate=1; u.pitch=1;
  u.onstart=()=>{ state.speaking=true; dom.read.classList.add('active'); dom.readLabel.textContent='Vorlesen stoppen'; status('Wiedergabe','recording','Text wird vorgelesen.'); };
  const finish=()=>{ if(state.utterance!==u) return; stopRead(); if(state.phase==='paused') status('Pausiert','paused'); else if(state.phase==='recording') status('Hört zu …','recording'); else status('Bereit'); };
  u.onend=finish; u.onerror=finish; state.utterance=u; window.speechSynthesis.speak(u);
};

dom.start.onclick=startRecord; dom.pause.onclick=pauseRecord; dom.stop.onclick=stopRecord;

dom.play.onclick=async()=>{ if(!state.audioURL) return; if(dom.audio.paused){ try{ await dom.audio.play(); }catch(_){ notice('Wiedergabe nicht möglich.'); } } else dom.audio.pause(); };
[['play','#i-pause'],['pause','#i-play'],['ended','#i-play']].forEach(([ev,href])=>dom.audio.addEventListener(ev,()=>dom.playIconUse.setAttribute('href',href)));
dom.audio.addEventListener('timeupdate',updatePlayPosition); dom.audio.addEventListener('durationchange',updatePlayPosition);
dom.audio.addEventListener('loadedmetadata',()=>{ updatePlayPosition(); }); dom.audio.addEventListener('seeked',updatePlayPosition);
function seekTo(sec){ if(!state.audioURL) return; try{ dom.audio.currentTime=Math.max(0,Math.min(duration(),sec)); }catch(_){ notice('Dieses Audioformat kann nicht gespult werden.'); } updatePlayPosition(); }
dom.seek.oninput=()=>seekTo(duration()*Number(dom.seek.value)/1000);
dom.back.onclick=()=>seekTo((dom.audio.currentTime||0)-10); dom.forward.onclick=()=>seekTo((dom.audio.currentTime||0)+10);
dom.download.onclick=()=>{ if(!state.audioURL) return; const ext=state.audioBlob?.type.includes('mp4')?'m4a':state.audioBlob?.type.includes('ogg')?'ogg':'webm'; const a=document.createElement('a'); a.href=state.audioURL; a.download='Deutsch_Aufnahme_'+new Date().toISOString().slice(0,19).replace(/[T:]/g,'-')+'.'+ext; document.body.append(a); a.click(); a.remove(); };
dom.remove.onclick=()=>{ if(!state.audioURL) return; clearAudio(); notice('Tonaufnahme gelöscht.'); };

function adjustViewport(){
  const vv=window.visualViewport; if(!vv) return;
  const keyboard=document.activeElement===dom.result && vv.height<window.innerHeight*0.72;
  document.body.classList.toggle('keyboard-open', keyboard);
}
window.visualViewport?.addEventListener('resize',adjustViewport); window.addEventListener('resize',adjustViewport);
window.addEventListener('pagehide',()=>{ clearTimeout(state.restart); if(state.session) try{state.session.engine.abort()}catch(_){ } clearRecorder(); stopRead(); });
(function init(){
  const old=saved(KEY_TEXT); if(old!==null) setText(old); else count();
  const size=Number(saved(KEY_SIZE)); if(size>=16 && size<=36){ state.fontSize=size; document.documentElement.style.setProperty('--font-size',size+'px'); }
  const theme=saved(KEY_THEME); setTheme(theme==='1');
  drawButtons(); dom.undo.disabled=true; refreshAudioButtons(); updatePlayPosition(); adjustViewport();
  status('Bereit');
  if(!SpeechEngine){ dom.start.disabled=true; status('Nicht verfügbar','error','Bitte Chrome, Edge oder Safari prüfen.'); }
})();
</script>
</body>
</html>
