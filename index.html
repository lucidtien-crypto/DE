<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sprache zu Text Editor</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
:root{color-scheme:light;--bg:#fbf9f5;--card:#fff;--ink:#1f2937;--muted:#64748b;--line:#d9dee6;--green:#059669;--greenbg:#ecfdf5;--red:#dc2626;--focus:#2563eb;--shadow:0 3px 14px #0000000a}
body.dark-mode{color-scheme:dark;--bg:#121316;--card:#1e2025;--ink:#f3f4f6;--muted:#b3bdcb;--line:#424752;--greenbg:#0d2419;--shadow:0 3px 14px #00000030}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;padding:16px 12px}main{max-width:900px;margin:auto;display:grid;gap:10px}
header{display:flex;align-items:center;gap:10px;min-height:48px;flex-wrap:wrap}.heading{display:flex;align-items:center;gap:7px;flex-wrap:wrap;min-width:0}h1{font-size:clamp(17px,2.8vw,24px);margin:0;font-weight:700;letter-spacing:-.45px}.mini{width:40px;height:40px;display:inline-flex;align-items:center;justify-content:center;padding:0;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;font-size:19px;font-weight:700;line-height:1;font-family:inherit;cursor:pointer;touch-action:manipulation}.mini:hover,.small-action:hover{border-color:var(--green)}.punct{font-family:Arial,sans-serif;font-size:21px}.theme{font-size:16px}.status{margin-left:auto;display:flex;align-items:center;gap:7px;color:var(--muted);font-size:13px;font-weight:600;white-space:nowrap}.status-dot{width:8px;height:8px;background:#94a3b8;border-radius:50%;flex-shrink:0}.status-dot.ready{background:var(--green);animation:blink 2.4s ease-in-out infinite}.status-dot.active{background:var(--red);animation:blink 1.4s ease-in-out infinite}.status-dot.error{background:var(--red)}@keyframes blink{50%{opacity:.38}}@media(prefers-reduced-motion:reduce){.status-dot{animation:none!important}}
.editor{width:100%;min-height:300px;resize:vertical;padding:17px;border:2px solid var(--line);border-radius:14px;background:var(--card);color:var(--ink);font-size:24px;line-height:1.65;font-family:inherit;box-shadow:var(--shadow);outline:none;white-space:pre-wrap}.editor:focus{border-color:var(--green)}.editor.recording{border-color:var(--green);box-shadow:0 0 0 3px #05966925}.editor::placeholder{color:var(--muted);opacity:.85}
.stats{display:flex;align-items:center;justify-content:space-between;gap:8px;color:var(--muted);font-size:13px;padding:0 4px}.font-controls{display:flex;align-items:center;gap:4px}.font-controls .mini{height:30px;width:38px;font-size:14px}
.controls-main{display:grid;grid-template-columns:56px minmax(0,1fr);gap:8px}.controls-edit{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}.action{min-height:58px;border-radius:11px;border:1px solid var(--line);display:flex;align-items:center;justify-content:center;gap:8px;background:var(--card);color:var(--ink);font-size:16px;font-weight:600;line-height:1.15;font-family:inherit;cursor:pointer;touch-action:manipulation;padding:9px 5px}.action i{font-size:19px}.action:disabled{opacity:.45;cursor:not-allowed}.action:active:not(:disabled),.mini:active{transform:translateY(1px)}.start{background:var(--greenbg);color:var(--ink);border-color:#05966970;font-size:clamp(16px,2.5vw,20px)}.start i{color:var(--green)}.start.listening{background:#fee2e2;border-color:#dc262680;color:#991b1b}.start.listening i{color:#dc2626}.danger{color:var(--red)}.small-action{font-size:14px}.small-action i{font-size:18px}.stack{display:flex;flex-direction:column;align-items:center;gap:2px}.stack span{font-size:13px}.action:focus-visible,.mini:focus-visible,.editor:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.toast{position:fixed;bottom:18px;left:50%;transform:translate(-50%,15px);max-width:min(92vw,520px);background:#1f2937;color:#fff;border-radius:22px;padding:11px 18px;font-size:14px;box-shadow:0 5px 20px #0004;opacity:0;pointer-events:none;transition:opacity .18s,transform .18s;z-index:10;text-align:center}.toast.show{opacity:1;transform:translate(-50%,0)}
@media(max-width:520px){body{padding:9px 8px}main{gap:8px}header{gap:5px}.heading{gap:5px}h1{font-size:17px}.mini{width:37px;height:39px}.status{font-size:12px}.editor{min-height:260px;font-size:21px;padding:12px}.controls-main{grid-template-columns:52px minmax(0,1fr);gap:6px}.controls-edit{gap:5px}.action{min-height:57px}.small-action{font-size:12px}.stack span{font-size:11px}}
</style>
</head>
<body>
<main>
<header>
  <div class="heading">
    <h1>Sprache zu Text Editor</h1>
    <button class="mini punct" id="period" title="Punkt einfügen" aria-label="Punkt einfügen">.</button>
    <button class="mini punct" id="comma" title="Komma einfügen" aria-label="Komma einfügen">,</button>
    <button class="mini theme" id="theme" title="Hell-/Dunkelmodus" aria-label="Hell-/Dunkelmodus"><i class="fa-solid fa-moon"></i></button>
  </div>
  <div class="status" role="status" aria-live="polite"><span id="statusDot" class="status-dot ready"></span><span id="statusText">Bereit.</span></div>
</header>
<textarea id="resultText" class="editor" spellcheck="true" aria-label="Diktierter und bearbeitbarer Text" placeholder="Der Text erscheint hier, sobald Sie sprechen..."></textarea>
<div class="stats"><span id="stats">0 Wörter | 0 Zeichen</span><div class="font-controls"><span>Schrift:</span><button class="mini" id="fontDown" aria-label="Schrift verkleinern">A−</button><button class="mini" id="fontUp" aria-label="Schrift vergrößern">A+</button></div></div>
<div class="controls-main">
  <button class="action" id="speak" title="Text vorlesen" aria-label="Text vorlesen"><i class="fa-solid fa-volume-high"></i></button>
  <button class="action start" id="start"><i class="fa-solid fa-microphone"></i><span>Sprechen starten</span></button>
</div>
<div class="controls-edit">
  <button class="action small-action" id="deleteWord" title="Ein Wort löschen"><span class="stack"><i class="fa-solid fa-trash-can"></i><span>1 Wort</span></span></button>
  <button class="action small-action danger" id="clearAll" title="Alles löschen"><span class="stack"><i class="fa-solid fa-trash-can"></i><span>Alles</span></span></button>
  <button class="action small-action" id="undo" title="Rückgängig" aria-label="Rückgängig" disabled><i class="fa-solid fa-rotate-left"></i></button>
  <button class="action small-action" id="copy" title="Alles kopieren" aria-label="Alles kopieren"><i class="fa-solid fa-copy"></i></button>
</div>
</main>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script>
'use strict';
const $=id=>document.getElementById(id);
const editor=$('resultText'),start=$('start'),speak=$('speak'),undo=$('undo'),dot=$('statusDot'),status=$('statusText');
const SpeechRecognition=window.SpeechRecognition||window.webkitSpeechRecognition;
let recognition=null,desired=false,active=false,finalThisRound='',interimText='',committed='',undoStack=[],fontSize=24,lastSelection={start:0,end:0},toastTimer=null,tts=null,restarting=false,stopStatus='Bereit.';
function notify(msg){$('toast').textContent=msg;$('toast').classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>$('toast').classList.remove('show'),2400)}
function setStatus(msg,state='ready'){status.textContent=msg;dot.className='status-dot '+state}
function stats(){const t=editor.value.trim();$('stats').textContent=`${t?t.split(/\s+/u).length:0} Wörter | ${editor.value.length} Zeichen`}
function persist(){try{localStorage.setItem('voiceDraftDe',editor.value)}catch(e){}stats()}
function saveUndo(){undoStack.push({value:editor.value,start:editor.selectionStart,end:editor.selectionEnd});if(undoStack.length>40)undoStack.shift();undo.disabled=false}
function syncEditor(value){editor.value=value;committed=value;persist()}
function separator(text){return text&&!/\s$/u.test(text)?' ':''}
function addTranscript(existing,chunk){return existing+separator(existing)+chunk.trim()}
function capGerman(text){if(!text)return text;return text.replace(/(^|[.!?]\s+|\n\s*)([a-zäöü])/gu,(_,prefix,c)=>prefix+c.toUpperCase())}
function stopRecording(){desired=false;restarting=false;if(recognition&&active){try{recognition.stop()}catch(e){}}else finishRecording()}
function finishRecording(){active=false;editor.classList.remove('recording');start.classList.remove('listening');start.innerHTML='<i class="fa-solid fa-microphone"></i><span>Sprechen starten</span>';setStatus(stopStatus);}
function commitLive(){if(!active)return;const value=capGerman(addTranscript(committed,finalThisRound.trim()));syncEditor(value);finalThisRound='';interimText=''}
function pauseForEdit(){if(!desired&&!active)return;commitLive();stopRecording()}
function editValue(value,caret){saveUndo();syncEditor(value);if(Number.isInteger(caret)){editor.focus();editor.setSelectionRange(caret,caret);lastSelection={start:caret,end:caret}}}
function rememberSelection(){lastSelection={start:editor.selectionStart,end:editor.selectionEnd}}
editor.addEventListener('click',rememberSelection);editor.addEventListener('keyup',rememberSelection);editor.addEventListener('select',rememberSelection);
editor.addEventListener('input',()=>{if(desired||active){desired=false;finalThisRound='';interimText='';stopStatus='Bereit.';if(recognition){try{recognition.abort()}catch(e){}}}committed=editor.value;persist();rememberSelection()});
function insertPunctuation(symbol){pauseForEdit();const t=editor.value;let {start:s,end:e}=lastSelection;if(s>t.length||e>t.length){s=e=t.length}const before=t.slice(0,s).replace(/[ \t]+$/u,'');const after=t.slice(e).replace(/^[ \t]*/u,'');const addition=symbol+(after&&!/^\s/u.test(after)?' ':' ');const value=capGerman(before+addition+after);editValue(value,(before+addition).length);notify(symbol==='.'?'Punkt eingefügt.':'Komma eingefügt.')}
$('period').onclick=()=>insertPunctuation('.');$('comma').onclick=()=>insertPunctuation(',');
$('deleteWord').onclick=()=>{pauseForEdit();const t=editor.value;if(!t.trim())return;const trimmed=t.replace(/\s+$/u,'');const next=trimmed.replace(/\S+$/u,'').replace(/\s+$/u,'');editValue(next,next.length);notify('1 Wort gelöscht.')};
$('clearAll').onclick=()=>{pauseForEdit();if(!editor.value)return;editValue('',0);notify('Alles gelöscht. Rückgängig ist möglich.')};
undo.onclick=()=>{pauseForEdit();const prev=undoStack.pop();if(!prev)return;syncEditor(prev.value);editor.focus();editor.setSelectionRange(prev.start,prev.end);rememberSelection();undo.disabled=!undoStack.length;notify('Wiederhergestellt.')};
$('copy').onclick=async()=>{const text=editor.value;if(!text){notify('Kein Text zum Kopieren.');return}try{if(navigator.clipboard&&window.isSecureContext)await navigator.clipboard.writeText(text);else{editor.focus();editor.select();if(!document.execCommand('copy'))throw Error('copy failed');rememberSelection()}notify('Text kopiert.')}catch(e){notify('Kopieren nicht möglich. Bitte Text markieren.')}};
$('fontUp').onclick=()=>{fontSize=Math.min(40,fontSize+2);editor.style.fontSize=fontSize+'px'};
$('fontDown').onclick=()=>{fontSize=Math.max(16,fontSize-2);editor.style.fontSize=fontSize+'px'};
function themeIcon(){const dark=document.body.classList.contains('dark-mode');$('theme').innerHTML=dark?'<i class="fa-solid fa-sun"></i>':'<i class="fa-solid fa-moon"></i>'}
$('theme').onclick=()=>{document.body.classList.toggle('dark-mode');themeIcon();try{localStorage.setItem('voiceDraftTheme',document.body.classList.contains('dark-mode')?'dark':'light')}catch(e){}};
try{const draft=localStorage.getItem('voiceDraftDe');if(draft){editor.value=draft;committed=draft}if(localStorage.getItem('voiceDraftTheme')==='dark')document.body.classList.add('dark-mode')}catch(e){}themeIcon();stats();
function chooseGermanVoice(){const voices=speechSynthesis.getVoices();return voices.find(v=>v.lang.toLowerCase()==='de-de')||voices.find(v=>v.lang.toLowerCase().startsWith('de'))||null}
function updateSpeakButton(isSpeaking){speak.innerHTML=isSpeaking?'<i class="fa-solid fa-stop"></i>':'<i class="fa-solid fa-volume-high"></i>';speak.title=isSpeaking?'Vorlesen stoppen':'Text vorlesen';speak.setAttribute('aria-label',speak.title)}
speak.onclick=()=>{if(!('speechSynthesis' in window)){notify('Sprachausgabe nicht unterstützt.');return}if(speechSynthesis.speaking||speechSynthesis.pending){speechSynthesis.cancel();tts=null;updateSpeakButton(false);notify('Vorlesen gestoppt.');return}const t=editor.value.trim();if(!t){notify('Kein Text zum Vorlesen.');return}pauseForEdit();const utter=new SpeechSynthesisUtterance(t);tts=utter;utter.lang='de-DE';utter.rate=1;const voice=chooseGermanVoice();if(voice)utter.voice=voice;utter.onstart=()=>{if(tts===utter)updateSpeakButton(true)};utter.onend=utter.onerror=()=>{if(tts===utter){tts=null;updateSpeakButton(false)}};speechSynthesis.speak(utter)};
function startRecognizer(){if(!recognition||!desired||active)return;try{recognition.lang='de-DE';recognition.start()}catch(e){if(e.name!=='InvalidStateError'){desired=false;stopStatus='Aufnahme nicht möglich.';finishRecording();notify('Mikrofon konnte nicht gestartet werden.')}}}
if(SpeechRecognition){recognition=new SpeechRecognition();recognition.lang='de-DE';recognition.continuous=false;recognition.interimResults=true;
recognition.onstart=()=>{active=true;finalThisRound='';interimText='';if(!desired){try{recognition.stop()}catch(e){}return}start.classList.add('listening');start.innerHTML='<i class="fa-solid fa-stop"></i><span>Sprechen stoppen</span>';editor.classList.add('recording');setStatus('Aufnahme läuft…','active')};
recognition.onresult=e=>{let final='',interim='';for(let i=0;i<e.results.length;i++){const r=e.results[i];if(r.isFinal)final+=r[0].transcript.trim()+' ';else interim+=r[0].transcript}finalThisRound=final.trim();interimText=interim.trim();const combined=addTranscript(committed,[finalThisRound,interimText].filter(Boolean).join(' '));editor.value=capGerman(combined);stats();editor.scrollTop=editor.scrollHeight};
recognition.onerror=e=>{if(e.error==='not-allowed'||e.error==='service-not-allowed'){desired=false;stopStatus='Mikrofonzugriff verweigert.';notify('Mikrofonzugriff im Browser erlauben.')}else if(e.error==='audio-capture'){desired=false;stopStatus='Mikrofon nicht gefunden.';notify('Bitte das Mikrofon prüfen.')}else if(e.error==='network'){desired=false;stopStatus='Verbindungsfehler.';notify('Spracherkennung benötigt möglicherweise Internet.')}else if(e.error==='no-speech'){/* A pause: allow normal restart. */}else if(e.error!=='aborted'){desired=false;stopStatus='Fehler bei der Aufnahme.';notify('Aufnahmefehler: '+e.error)}};
recognition.onend=()=>{active=false;const final=finalThisRound.trim();if(final){const value=capGerman(addTranscript(committed,final));syncEditor(value)}else{editor.value=committed;stats()}finalThisRound='';interimText='';if(desired){setStatus('Warte auf Sprache…','active');startRecognizer()}else finishRecording()};
start.onclick=()=>{if(desired){stopStatus='Bereit.';stopRecording();return}if('speechSynthesis' in window)speechSynthesis.cancel();updateSpeakButton(false);committed=editor.value;desired=true;stopStatus='Bereit.';setStatus('Mikrofon wird gestartet…','active');startRecognizer()};
}else{start.disabled=true;setStatus('Spracherkennung nicht verfügbar.','error');start.title='Bitte einen Browser mit Web Speech API verwenden.'}
window.addEventListener('pagehide',()=>{desired=false;if(recognition){try{recognition.abort()}catch(e){}}});
</script>
</body>
</html>
